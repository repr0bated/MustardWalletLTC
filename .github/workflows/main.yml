name: Build MustardWalletLTC

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: [ self-hosted, linux ]
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET Core 3.1 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '3.1.x'

      - name: Restore NuGet packages
        run: dotnet restore WalletWasabi.sln

      - name: Build solution
        run: dotnet build WalletWasabi.sln --configuration Release --no-restore

      - name: Publish GUI app
        run: dotnet publish WalletWasabi.Gui/WalletWasabi.Gui.csproj \
               --configuration Release \
               --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: MustardWalletLTC
          path: publish/
